env:
  default: main
  profiles:
    main:
      host: main
      tunnel: primary
      scheme: http

launchers:
  default-proxy: main
  browsers:
    entries:
      chrome:
        detect: chrome
        icon: GC
  applications:
    entries:
      editor:
        name: Code
        command: code
        icon: VS

hosts:
  main:
    ssh-config-host: localhost
    local-proxies:
      - name: primary
        listen: 127.0.0.1:17890
        mixed: true

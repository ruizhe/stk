[workspace]
members = [
    "crates/stk-core",
    "crates/stk-cli",
]
default-members = [
    "crates/stk-core",
    "crates/stk-cli",
]
exclude = ["crates/stk-gui"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
version = "0.1.19"

[workspace.dependencies]
anyhow = "1.0.103"
async-trait = "0.1.89"
clap = { version = "4.6.1", features = ["derive", "env"] }
glob = "0.3.3"
http-body-util = "0.1.3"
hyper = { version = "1.7.0", features = ["client", "http1", "server"] }
hyper-util = { version = "0.1.17", features = ["tokio"] }
n0-watcher = "1.0.0"
netwatch = "0.19.1"
notify = "8.2.0"
rand = "0.10.2"
russh = { version = "0.62.5", default-features = false, features = ["ring", "rsa"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
socket2 = "0.6.4"
ssh2-config = "0.7.1"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "io-util", "process", "signal", "sync", "time", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
toml = "1.1.2"

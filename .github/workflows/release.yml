name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to release, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write
  packages: read

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1
  RUST_VERSION: 1.95.0

jobs:
  validate:
    name: Validate release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      bundle-version: ${{ steps.version.outputs.bundle-version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Validate tag and package versions
        id: version
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?)$ ]]; then
            echo "Release tag must look like v1.2.3 or v1.2.3-rc.1: $tag" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          bundle_version="${version%%-*}"

          root_version="$(
            cargo metadata --format-version 1 --no-deps --locked |
              jq -r '.packages[] | select(.name == "stk-cli") | .version'
          )"
          gui_version="$(
            cargo metadata \
              --manifest-path crates/stk-gui/Cargo.toml \
              --format-version 1 \
              --no-deps \
              --locked |
              jq -r '.packages[] | select(.name == "stk-gui") | .version'
          )"
          plist_version="$(
            awk '
              /<key>CFBundleShortVersionString<\/key>/ {
                getline
                gsub(/^[[:space:]]*<string>|<\/string>[[:space:]]*$/, "")
                print
                exit
              }
            ' crates/stk-gui/macos/Info.plist
          )"

          for candidate in "$root_version" "$gui_version"; do
            if [[ "$candidate" != "$version" ]]; then
              echo "Tag $tag does not match project versions:" >&2
              echo "  workspace: $root_version" >&2
              echo "  GUI:       $gui_version" >&2
              exit 1
            fi
          done
          if [[ "$plist_version" != "$bundle_version" ]]; then
            echo "Tag $tag does not match the macOS bundle version:" >&2
            echo "  expected:  $bundle_version" >&2
            echo "  Info.plist:$plist_version" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          {
            echo "tag=$tag"
            echo "version=$version"
            echo "bundle-version=$bundle_version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  linux-appimage:
    name: Package Linux ${{ matrix.arch }} AppImage
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            lib_arch: x86_64-linux-gnu
            runtime_sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          - arch: aarch64
            runner: ubuntu-22.04-arm
            lib_arch: aarch64-linux-gnu
            runtime_sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gobject-introspection \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libdbusmenu-gtk3-dev \
            libgirepository1.0-dev \
            librsvg2-dev \
            libxdo-dev \
            desktop-file-utils \
            file \
            patchelf \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/stk-gui -> crates/stk-gui/target
          shared-key: linux-appimage-${{ matrix.arch }}-release

      - name: Build GUI
        run: >-
          cargo build
          --manifest-path crates/stk-gui/Cargo.toml
          --features desktop
          --release
          --locked

      - name: Pull Arch Linux compatibility image
        if: matrix.arch == 'x86_64'
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/archlinux/archlinux:base"
          printf '%s' "$GHCR_TOKEN" | \
            docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          for attempt in 1 2 3; do
            if docker pull "$image"; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            echo "::warning::Arch Linux image pull attempt $attempt failed; retrying"
            sleep "$((attempt * 10))"
          done

      - name: Create Linux AppImage
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          LIB_ARCH: ${{ matrix.lib_arch }}
          RUNTIME_SHA256: ${{ matrix.runtime_sha256 }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          appimage="dist/stk-v${VERSION}-linux-${ARCH}.appimage"
          ./scripts/build-linux-appimage.sh \
            crates/stk-gui/target/release/stk-gui \
            "$appimage"

          runtime="target/appimage-tools/runtime-${ARCH}-20251108"
          appdir="target/appimage/SSH_Tunnel_Keeper.AppDir"
          test "$(sha256sum "$runtime" | awk '{print $1}')" = "$RUNTIME_SHA256"
          test "$("$appimage" --appimage-offset)" = "$(stat -c %s "$runtime")"
          test -e "$appdir/usr/lib/libgtk-3.so.0"
          test -e "$appdir/usr/lib/libwebkit2gtk-4.1.so.0"
          test -e "$appdir/usr/lib/libayatana-appindicator3.so.1"
          grep -a -q '<method name="Activate">' \
            "$appdir/usr/lib/libayatana-appindicator3.so.1"
          test -x "$appdir/usr/lib/${LIB_ARCH}/webkit2gtk-4.1/WebKitNetworkProcess"
          test -x "$appdir/usr/lib/${LIB_ARCH}/webkit2gtk-4.1/WebKitWebProcess"
          checksum="$(sha256sum "$appimage")"
          printf '%s\n' "$checksum" | sha256sum --check

          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --help >/dev/null

          run_docker_test() {
            local label=$1
            shift
            local attempt
            local docker_status
            local last_line
            local log_file
            for attempt in 1 2 3; do
              log_file="$(mktemp)"
              if docker run "$@" 2>&1 | tee "$log_file"; then
                return 0
              else
                docker_status=$?
              fi
              last_line="$(tail -n 1 "$log_file" | sed -e "s/%/%25/g" -e "s/\r/%0D/g")"
              if [[ -z "$last_line" ]]; then
                last_line="docker run exited without output"
              fi
              last_line="docker exit $docker_status: $last_line"
              if [[ "$attempt" == 3 ]]; then
                echo "::error title=$label failed::$last_line"
                return 1
              fi
              echo "::warning title=$label attempt $attempt failed::$last_line"
              sleep "$((attempt * 10))"
            done
          }

          for ubuntu in 22.04 24.04; do
            run_docker_test "Ubuntu $ubuntu AppImage test" --rm \
              -e APPIMAGE_EXTRACT_AND_RUN=1 \
              -v "$PWD/$appimage:/opt/stk.appimage:ro" \
              "ubuntu:$ubuntu" \
              sh -eu -c '
                apt-get -o Acquire::Retries=5 update >/dev/null
                DEBIAN_FRONTEND=noninteractive apt-get \
                  -o Acquire::Retries=5 install -y --no-install-recommends \
                  libwebkit2gtk-4.1-0 librsvg2-2 libxdo3 >/dev/null
                /opt/stk.appimage --help >/dev/null
              '
          done

          if [[ "$ARCH" == x86_64 ]]; then
            run_docker_test "Arch Linux AppImage test" --pull=never --rm \
              -e APPIMAGE_EXTRACT_AND_RUN=1 \
              -v "$PWD/$appimage:/opt/stk.appimage:ro" \
              ghcr.io/archlinux/archlinux:base \
              sh -eu -c '
                echo "Arch compatibility container started"
                sed -i "s/^#DisableSandboxSyscalls/DisableSandboxSyscalls/" /etc/pacman.conf
                installed=false
                for mirror in \
                  "https://mirror.osbeck.com/archlinux/\$repo/os/\$arch" \
                  "https://mirror.clarkson.edu/archlinux/\$repo/os/\$arch" \
                  "https://mirrors.iu13.net/archlinux/\$repo/os/\$arch" \
                  "https://mirror.lug.umbc.edu/archlinux/\$repo/os/\$arch" \
                  "https://mirrors.kernel.org/archlinux/\$repo/os/\$arch"
                do
                  echo "Trying Arch package mirror: $mirror"
                  printf "Server = %s\n" "$mirror" > /etc/pacman.d/mirrorlist
                  if pacman -Sy --noconfirm --needed \
                    gtk3 librsvg webkit2gtk-4.1 xdotool >/dev/null
                  then
                    installed=true
                    break
                  fi
                done
                $installed
                /opt/stk.appimage --help >/dev/null
                cd /tmp
                /opt/stk.appimage --appimage-extract >/dev/null
                test -e squashfs-root/usr/lib/libayatana-appindicator3.so.1
                grep -a -q "<method name=\"Activate\">" \
                  squashfs-root/usr/lib/libayatana-appindicator3.so.1
                LD_LIBRARY_PATH="$PWD/squashfs-root/usr/lib" \
                  ldd squashfs-root/usr/lib/libayatana-appindicator3.so.1 \
                  > /tmp/stk-appindicator-ldd.txt
                ! grep -q "not found" /tmp/stk-appindicator-ldd.txt
              '
          fi

      - name: Upload Linux AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-${{ matrix.arch }}
          path: dist/stk-v${{ needs.validate.outputs.version }}-linux-${{ matrix.arch }}.appimage
          if-no-files-found: error
          retention-days: 7

  linux-cli-musl:
    name: Package static Linux CLI for ${{ matrix.arch }}
    needs: validate
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            runner: native
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            runner: qemu-aarch64

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install static binary verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file qemu-user

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
          cache-key: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
          fallback: none

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-musl-release-${{ matrix.target }}

      - name: Build static CLI
        run: >-
          cargo zigbuild
          --release
          -p stk-cli
          --target ${{ matrix.target }}
          --locked

      - name: Verify and package static CLI
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          TARGET: ${{ matrix.target }}
          RUNNER: ${{ matrix.runner }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          binary="target/${TARGET}/release/stk"
          description="$(file "$binary")"
          echo "$description"
          if [[ ! "$description" =~ (statically\ linked|static-pie\ linked) ]]; then
            echo "Expected a statically linked musl executable" >&2
            exit 1
          fi
          if readelf -d "$binary" 2>/dev/null | grep -q '(NEEDED)'; then
            echo "Static CLI unexpectedly contains a shared-library dependency" >&2
            exit 1
          fi
          if [[ "$RUNNER" == native ]]; then
            "$binary" --help >/dev/null
          else
            "$RUNNER" "$binary" --help >/dev/null
          fi

          package="stk-v${VERSION}-linux-${ARCH}-musl"
          stage="dist/${package}"
          mkdir -p "$stage/examples" "$stage/packaging/systemd"

          install -m 755 "$binary" "$stage/stk"
          install -m 644 \
            README.md README.zh-CN.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md \
            "$stage/"
          install -m 644 examples/basic.yaml examples/basic.json examples/basic.toml "$stage/examples/"
          install -m 644 examples/ssh-native.yaml examples/ssh-native.json examples/ssh-native.toml "$stage/examples/"
          install -m 644 packaging/systemd/stk.service "$stage/packaging/systemd/stk.service"

          tar -C dist -czf "dist/${package}.tar.gz" "$package"
          checksum="$(sha256sum "dist/${package}.tar.gz")"
          printf '%s\n' "$checksum" | sha256sum --check

      - name: Upload static Linux CLI
        uses: actions/upload-artifact@v4
        with:
          name: linux-cli-${{ matrix.arch }}-musl
          path: dist/stk-v${{ needs.validate.outputs.version }}-linux-${{ matrix.arch }}-musl.tar.gz
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Package Windows ${{ matrix.arch }}
    needs: validate
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: windows-latest
          - arch: aarch64
            runner: windows-11-arm

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/stk-gui -> crates/stk-gui/target
          shared-key: windows-${{ matrix.arch }}-release

      - name: Build CLI
        run: cargo build --release -p stk-cli --locked

      - name: Build GUI
        run: >-
          cargo build
          --manifest-path crates/stk-gui/Cargo.toml
          --features desktop
          --release
          --locked

      - name: Create release archive
        shell: pwsh
        env:
          ARCH: ${{ matrix.arch }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          $ErrorActionPreference = "Stop"
          $package = "stk-v$env:VERSION-windows-$env:ARCH"
          $stage = Join-Path "dist" $package
          $examples = Join-Path $stage "examples"

          New-Item -ItemType Directory -Force -Path $examples | Out-Null
          Copy-Item "target/release/stk.exe" (Join-Path $stage "stk.exe")
          Copy-Item "crates/stk-gui/target/release/stk-gui.exe" (Join-Path $stage "stk-gui.exe")
          $documents = @(
            "README.md",
            "README.zh-CN.md",
            "LICENSE-MIT",
            "LICENSE-APACHE",
            "THIRD-PARTY-NOTICES.md"
          )
          Copy-Item $documents $stage
          Copy-Item "examples/basic.yaml", "examples/basic.json", "examples/basic.toml" $examples
          Copy-Item "examples/ssh-native.yaml", "examples/ssh-native.json", "examples/ssh-native.toml" $examples

          $archive = Join-Path "dist" "$package.zip"
          Compress-Archive -Path "$stage/*" -DestinationPath $archive -CompressionLevel Optimal

      - name: Upload Windows archive
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  macos:
    name: Package macOS universal
    needs: validate
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/stk-gui -> crates/stk-gui/target
          shared-key: macos-universal-release

      - name: Build universal CLI
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p stk-cli --target aarch64-apple-darwin --locked
          cargo build --release -p stk-cli --target x86_64-apple-darwin --locked

      - name: Build universal GUI
        shell: bash
        run: |
          set -euo pipefail
          cargo build \
            --manifest-path crates/stk-gui/Cargo.toml \
            --features desktop \
            --release \
            --target aarch64-apple-darwin \
            --locked
          cargo build \
            --manifest-path crates/stk-gui/Cargo.toml \
            --features desktop \
            --release \
            --target x86_64-apple-darwin \
            --locked

      - name: Create release archive
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
          BUNDLE_VERSION: ${{ needs.validate.outputs.bundle-version }}
        run: |
          set -euo pipefail

          package="stk-v${VERSION}-macos-universal"
          stage="dist/${package}"
          app="$stage/SSH Tunnel Keeper.app"
          contents="$app/Contents"

          mkdir -p "$contents/MacOS" "$contents/Resources" "$stage/examples"

          lipo -create \
            target/aarch64-apple-darwin/release/stk \
            target/x86_64-apple-darwin/release/stk \
            -output "$stage/stk"
          lipo -create \
            crates/stk-gui/target/aarch64-apple-darwin/release/stk-gui \
            crates/stk-gui/target/x86_64-apple-darwin/release/stk-gui \
            -output "$contents/MacOS/stk-gui"
          chmod 755 "$stage/stk" "$contents/MacOS/stk-gui"

          cp crates/stk-gui/macos/Info.plist "$contents/Info.plist"
          cp crates/stk-gui/macos/AppIcon.icns "$contents/Resources/AppIcon.icns"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleShortVersionString $BUNDLE_VERSION" \
            "$contents/Info.plist"
          /usr/libexec/PlistBuddy \
            -c "Set :CFBundleVersion $GITHUB_RUN_NUMBER" \
            "$contents/Info.plist"

          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"

          cp \
            README.md README.zh-CN.md LICENSE-MIT LICENSE-APACHE THIRD-PARTY-NOTICES.md \
            "$stage/"
          cp examples/basic.yaml examples/basic.json examples/basic.toml "$stage/examples/"
          cp examples/ssh-native.yaml examples/ssh-native.json examples/ssh-native.toml "$stage/examples/"

          ditto -c -k --sequesterRsrc --keepParent "$stage" "dist/${package}.zip"
          ./scripts/create-macos-dmg.sh "$app" "dist/${package}.dmg"

      - name: Upload macOS archive
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs:
      - validate
      - linux-appimage
      - linux-cli-musl
      - windows
      - macos
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate release checksums
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          checksum_file="$(mktemp)"
          release_checksum="stk-v${VERSION}-sha256sums.txt"
          trap 'rm -f "$checksum_file"' EXIT
          cd dist
          find . -maxdepth 1 -type f ! -name "$release_checksum" -printf '%f\0' \
            | sort -z \
            | xargs -0 sha256sum > "$checksum_file"
          mv "$checksum_file" "$release_checksum"
          sha256sum --check "$release_checksum"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate.outputs.tag }}
          name: SSH Tunnel Keeper ${{ needs.validate.outputs.tag }}
          generate_release_notes: true
          prerelease: ${{ needs.validate.outputs.prerelease }}
          fail_on_unmatched_files: true
          files: dist/*

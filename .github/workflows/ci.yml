name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1
  RUST_VERSION: 1.95.0

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/stk-gui -> crates/stk-gui/target

      - name: Check core and CLI formatting
        run: cargo fmt --all -- --check

      - name: Check GUI formatting
        run: cargo fmt --manifest-path crates/stk-gui/Cargo.toml -- --check

      - name: Lint core and CLI
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Lint GUI
        run: >-
          cargo clippy
          --manifest-path crates/stk-gui/Cargo.toml
          --features desktop
          --all-targets
          --locked
          --
          -D warnings

      - name: Test core and CLI
        run: cargo test --workspace --all-targets --locked

      - name: Test GUI
        run: >-
          cargo test
          --manifest-path crates/stk-gui/Cargo.toml
          --features desktop
          --locked

  linux-cli-musl:
    name: Static Linux CLI on ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-unknown-linux-musl
            runner: native
          - arch: aarch64
            target: aarch64-unknown-linux-musl
            runner: qemu-aarch64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install static binary verification tools
        run: |
          sudo apt-get update
          sudo apt-get install -y file qemu-user

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.13.0
          cache-key: ${{ matrix.target }}

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-zigbuild
          fallback: none

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-musl-${{ matrix.target }}

      - name: Build static CLI
        run: >-
          cargo zigbuild
          --release
          -p stk-cli
          --target ${{ matrix.target }}
          --locked

      - name: Verify static CLI
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          RUNNER: ${{ matrix.runner }}
        run: |
          set -euo pipefail
          binary="target/${TARGET}/release/stk"
          description="$(file "$binary")"
          echo "$description"
          if [[ ! "$description" =~ (statically\ linked|static-pie\ linked) ]]; then
            echo "Expected a statically linked musl executable" >&2
            exit 1
          fi
          if readelf -d "$binary" 2>/dev/null | grep -q '(NEEDED)'; then
            echo "Static CLI unexpectedly contains a shared-library dependency" >&2
            exit 1
          fi
          if [[ "$RUNNER" == native ]]; then
            "$binary" --help >/dev/null
          else
            "$RUNNER" "$binary" --help >/dev/null
          fi

  platform-build:
    name: Release build on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            os: ubuntu-22.04
            arch: x86_64
            lib_arch: x86_64-linux-gnu
            runtime_sha256: 2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d
          - platform: Linux aarch64
            os: ubuntu-22.04-arm
            arch: aarch64
            lib_arch: aarch64-linux-gnu
            runtime_sha256: 00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444
          - platform: macOS
            os: macos-latest
            arch: universal
          - platform: Windows x86_64
            os: windows-latest
            arch: x86_64
          - platform: Windows aarch64
            os: windows-11-arm
            arch: aarch64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            gobject-introspection \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            libdbusmenu-gtk3-dev \
            libgirepository1.0-dev \
            librsvg2-dev \
            libxdo-dev \
            desktop-file-utils \
            file \
            patchelf \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/stk-gui -> crates/stk-gui/target
          shared-key: ${{ runner.os }}-${{ matrix.arch }}-release

      - name: Build CLI
        run: cargo build --release -p stk-cli --locked

      - name: Build GUI
        run: >-
          cargo build
          --manifest-path crates/stk-gui/Cargo.toml
          --features desktop
          --release
          --locked

      - name: Test Windows named-pipe reload recovery
        if: runner.os == 'Windows'
        run: >-
          cargo test
          -p stk-core
          --locked
          named_pipe_listener_waits_for_previous_generation_connections

      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          appimage="dist/stk-linux-${ARCH}.appimage"
          ./scripts/build-linux-appimage.sh \
            crates/stk-gui/target/release/stk-gui \
            "$appimage"

      - name: Verify Linux AppImage runtime
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          LIB_ARCH: ${{ matrix.lib_arch }}
          RUNTIME_SHA256: ${{ matrix.runtime_sha256 }}
        run: |
          set -euo pipefail
          appimage="dist/stk-linux-${ARCH}.appimage"
          runtime="target/appimage-tools/runtime-${ARCH}-20251108"
          appdir="target/appimage/SSH_Tunnel_Keeper.AppDir"
          test "$(sha256sum "$runtime" | awk '{print $1}')" = "$RUNTIME_SHA256"
          test "$("$appimage" --appimage-offset)" = "$(stat -c %s "$runtime")"
          test -e "$appdir/usr/lib/libgtk-3.so.0"
          test -e "$appdir/usr/lib/libwebkit2gtk-4.1.so.0"
          test -e "$appdir/usr/lib/libayatana-appindicator3.so.1"
          grep -a -q '<method name="Activate">' \
            "$appdir/usr/lib/libayatana-appindicator3.so.1"
          test -x "$appdir/usr/lib/${LIB_ARCH}/webkit2gtk-4.1/WebKitNetworkProcess"
          test -x "$appdir/usr/lib/${LIB_ARCH}/webkit2gtk-4.1/WebKitWebProcess"
          sha256sum "$appimage" > "$appimage.sha256"
          sha256sum --check "$appimage.sha256"
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --help >/dev/null

      - name: Verify AppImage extraction on Ubuntu 22.04
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          appimage="dist/stk-linux-${ARCH}.appimage"
          for attempt in 1 2 3; do
            if docker run --rm \
              -e APPIMAGE_EXTRACT_AND_RUN=1 \
              -v "$PWD/$appimage:/opt/stk.appimage:ro" \
              ubuntu:22.04 \
              sh -eu -c '
                apt-get -o Acquire::Retries=5 update >/dev/null
                DEBIAN_FRONTEND=noninteractive apt-get \
                  -o Acquire::Retries=5 install -y --no-install-recommends \
                  libwebkit2gtk-4.1-0 librsvg2-2 libxdo3 >/dev/null
                /opt/stk.appimage --help
              '
            then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            echo "::warning::Ubuntu 22.04 AppImage test attempt $attempt failed; retrying"
            sleep "$((attempt * 10))"
          done

      - name: Verify AppImage extraction on Ubuntu 24.04
        if: runner.os == 'Linux'
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          appimage="dist/stk-linux-${ARCH}.appimage"
          for attempt in 1 2 3; do
            if docker run --rm \
              -e APPIMAGE_EXTRACT_AND_RUN=1 \
              -v "$PWD/$appimage:/opt/stk.appimage:ro" \
              ubuntu:24.04 \
              sh -eu -c '
                apt-get -o Acquire::Retries=5 update >/dev/null
                DEBIAN_FRONTEND=noninteractive apt-get \
                  -o Acquire::Retries=5 install -y --no-install-recommends \
                  libwebkit2gtk-4.1-0 librsvg2-2 libxdo3 >/dev/null
                /opt/stk.appimage --help
              '
            then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            echo "::warning::Ubuntu 24.04 AppImage test attempt $attempt failed; retrying"
            sleep "$((attempt * 10))"
          done

      - name: Pull Arch Linux compatibility image
        if: runner.os == 'Linux' && matrix.arch == 'x86_64'
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/archlinux/archlinux:base"
          printf '%s' "$GHCR_TOKEN" | \
            docker login ghcr.io --username "${{ github.actor }}" --password-stdin
          for attempt in 1 2 3; do
            if docker pull "$image"; then
              break
            fi
            if [[ "$attempt" == 3 ]]; then
              exit 1
            fi
            echo "::warning::Arch Linux image pull attempt $attempt failed; retrying"
            sleep "$((attempt * 10))"
          done

      - name: Verify AppImage extraction on Arch Linux
        if: runner.os == 'Linux' && matrix.arch == 'x86_64'
        shell: bash
        run: |
          set -euo pipefail
          appimage="dist/stk-linux-x86_64.appimage"
          for attempt in 1 2 3; do
            log_file="$(mktemp)"
            if docker run --pull=never --rm \
              -e APPIMAGE_EXTRACT_AND_RUN=1 \
              -v "$PWD/$appimage:/opt/stk.appimage:ro" \
              ghcr.io/archlinux/archlinux:base \
              sh -eu -c '
                echo "Arch compatibility container started"
                sed -i "s/^#DisableSandboxSyscalls/DisableSandboxSyscalls/" /etc/pacman.conf
                installed=false
                for mirror in \
                  "https://mirror.osbeck.com/archlinux/\$repo/os/\$arch" \
                  "https://mirror.clarkson.edu/archlinux/\$repo/os/\$arch" \
                  "https://mirrors.iu13.net/archlinux/\$repo/os/\$arch" \
                  "https://mirror.lug.umbc.edu/archlinux/\$repo/os/\$arch" \
                  "https://mirrors.kernel.org/archlinux/\$repo/os/\$arch"
                do
                  echo "Trying Arch package mirror: $mirror"
                  printf "Server = %s\n" "$mirror" > /etc/pacman.d/mirrorlist
                  if pacman -Sy --noconfirm --needed \
                    gtk3 librsvg webkit2gtk-4.1 xdotool >/dev/null
                  then
                    installed=true
                    break
                  fi
                done
                $installed
                /opt/stk.appimage --help
                cd /tmp
                /opt/stk.appimage --appimage-extract >/dev/null
                test -e squashfs-root/usr/lib/libayatana-appindicator3.so.1
                grep -a -q '<method name="Activate">' \
                  squashfs-root/usr/lib/libayatana-appindicator3.so.1
                LD_LIBRARY_PATH="$PWD/squashfs-root/usr/lib" \
                  ldd squashfs-root/usr/lib/libayatana-appindicator3.so.1 \
                  > /tmp/stk-appindicator-ldd.txt
                ! grep -q "not found" /tmp/stk-appindicator-ldd.txt
              ' 2>&1 | tee "$log_file"
            then
              break
            else
              docker_status=$?
            fi
            last_line="$(tail -n 1 "$log_file" | sed -e "s/%/%25/g" -e "s/\r/%0D/g")"
            if [[ -z "$last_line" ]]; then
              last_line="docker run exited without output"
            fi
            last_line="docker exit $docker_status: $last_line"
            if [[ "$attempt" == 3 ]]; then
              echo "::error title=Arch Linux AppImage test failed::$last_line"
              exit 1
            fi
            echo "::warning title=Arch Linux AppImage test attempt $attempt failed::$last_line"
            sleep "$((attempt * 10))"
          done

      - name: Verify macOS application and DMG packaging
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="$(./scripts/build-macos-app.sh)"
          ./scripts/create-macos-dmg.sh \
            "$app" \
            "dist/stk-ci-macos-${{ runner.arch }}.dmg"

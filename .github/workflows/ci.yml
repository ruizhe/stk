name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: 1
  RUST_VERSION: 1.95.0

jobs:
  quality:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/stk-gui -> crates/stk-gui/target

      - name: Check core and CLI formatting
        run: cargo fmt --all -- --check

      - name: Check GUI formatting
        run: cargo fmt --manifest-path crates/stk-gui/Cargo.toml -- --check

      - name: Lint core and CLI
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Lint GUI
        run: >-
          cargo clippy
          --manifest-path crates/stk-gui/Cargo.toml
          --features desktop
          --all-targets
          --locked
          --
          -D warnings

      - name: Test core and CLI
        run: cargo test --workspace --all-targets --locked

      - name: Test GUI
        run: >-
          cargo test
          --manifest-path crates/stk-gui/Cargo.toml
          --features desktop
          --locked

  platform-build:
    name: Release build on ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: Linux x86_64
            os: ubuntu-22.04
          - platform: macOS
            os: macos-latest
          - platform: Windows x86_64
            os: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            desktop-file-utils \
            patchelf \
            pkg-config

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo data
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            . -> target
            crates/stk-gui -> crates/stk-gui/target
          shared-key: ${{ runner.os }}-release

      - name: Build CLI
        run: cargo build --release -p stk-cli --locked

      - name: Build GUI
        run: >-
          cargo build
          --manifest-path crates/stk-gui/Cargo.toml
          --features desktop
          --release
          --locked

      - name: Test Windows named-pipe reload recovery
        if: runner.os == 'Windows'
        run: >-
          cargo test
          -p stk-core
          --locked
          named_pipe_listener_waits_for_previous_generation_connections

      - name: Verify Linux AppImage packaging
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          appimage="dist/ssh-tunnel-keeper-ci-linux-x86_64.AppImage"
          ./scripts/build-linux-appimage.sh \
            crates/stk-gui/target/release/stk-gui \
            "$appimage"
          APPIMAGE_EXTRACT_AND_RUN=1 "$appimage" --help >/dev/null

      - name: Verify macOS application and DMG packaging
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          app="$(./scripts/build-macos-app.sh)"
          ./scripts/create-macos-dmg.sh \
            "$app" \
            "dist/ssh-tunnel-keeper-ci-macos-${{ runner.arch }}.dmg"
